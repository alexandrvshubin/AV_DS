[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-services-retrieval"
version = "2.1.0"
description = "Hybrid candidate generation and learning-to-rank pipeline for the Avito services benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19,<27",
    "scipy>=1.14,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.5,<5",
    "torch>=2.8,<3",
    "sentence-transformers>=5,<6",
    "hnswlib>=0.8,<1",
    "bm25s>=0.3.11,<0.4",
    "joblib>=1.5.2",
    "tqdm>=4.66,<5",
    "PyYAML>=6,<7",
    "psutil>=6,<8",
    "rapidfuzz>=3.10,<4",
    "pymorphy3>=2.0.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.13,<1",
]

[project.scripts]
avito-retrieval = "avito_retrieval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
